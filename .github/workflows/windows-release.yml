name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  export-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: true

      - name: Export Windows build
        run: godot --headless --path . --export-release "Windows Desktop" .exports/windows/ClaudeOtherGods.exe

      - name: Package release zip
        run: |
          mkdir -p dist
          cp .exports/windows/ClaudeOtherGods.exe dist/ClaudeOtherGods.exe
          cd dist
          zip -9 -r ClaudeOtherGods-windows.zip ClaudeOtherGods.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeOtherGods-windows
          path: |
            .exports/windows/ClaudeOtherGods.exe
            dist/ClaudeOtherGods-windows.zip

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .exports/windows/ClaudeOtherGods.exe
            dist/ClaudeOtherGods-windows.zip
