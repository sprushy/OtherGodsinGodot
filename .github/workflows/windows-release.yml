name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  export-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Godot version
        shell: pwsh
        run: |
          $version = (Get-Content .godot-version -Raw).Trim()
          if (-not $version) {
            throw ".godot-version is empty."
          }
          "GODOT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stamp build version
        shell: pwsh
        env:
          BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          $resourceVersion = $env:BUILD_VERSION -replace '^v', ''
          if ($resourceVersion -notmatch '^\d+(\.\d+){1,3}$') {
            $resourceVersion = '0.0.0'
          }
          $projectContent = Get-Content project.godot -Raw
          $projectContent = $projectContent -replace '(?m)^config/version=.*$', "config/version=`"$env:BUILD_VERSION`""
          Set-Content project.godot $projectContent -NoNewline
          $exportContent = Get-Content export_presets.cfg -Raw
          $exportContent = $exportContent -replace '(?m)^(application/(?:file_version|product_version|short_version|version)=)".*"$', "`${1}`"$resourceVersion`""
          Set-Content export_presets.cfg $exportContent -NoNewline

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Export Windows build
        run: |
          mkdir -p .exports/windows .exports/server dist
          godot --headless --path . --export-release "Windows Desktop" .exports/windows/OtherGods.exe
          godot --headless --path . --export-release "Windows Dedicated Server" .exports/server/OtherGodsServer.exe

      - name: Package release zips
        run: |
          cd .exports/windows
          zip -9 -r ../../dist/OtherGods-windows.zip *
          cd ../server
          zip -9 -r ../../dist/OtherGodsServer-windows.zip *

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OtherGods-windows
          path: |
            dist/OtherGods-windows.zip
            dist/OtherGodsServer-windows.zip

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OtherGods-windows.zip
            dist/OtherGodsServer-windows.zip

  export-macos:
    runs-on: macos-latest
    env:
      SPARKLE_VERSION: "2.9.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Godot version
        shell: pwsh
        run: |
          $version = (Get-Content .godot-version -Raw).Trim()
          if (-not $version) {
            throw ".godot-version is empty."
          }
          "GODOT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stamp build version
        shell: pwsh
        env:
          BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          $resourceVersion = $env:BUILD_VERSION -replace '^v', ''
          if ($resourceVersion -notmatch '^\d+(\.\d+){1,3}$') {
            $resourceVersion = '0.0.0'
          }
          $projectContent = Get-Content project.godot -Raw
          $projectContent = $projectContent -replace '(?m)^config/version=.*$', "config/version=`"$env:BUILD_VERSION`""
          Set-Content project.godot $projectContent -NoNewline
          $exportContent = Get-Content export_presets.cfg -Raw
          $exportContent = $exportContent -replace '(?m)^(application/(?:file_version|product_version|short_version|version)=)".*"$', "`${1}`"$resourceVersion`""
          Set-Content export_presets.cfg $exportContent -NoNewline

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Build Sparkle GDExtension
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install scons

          godot_cpp_dir="$RUNNER_TEMP/godot-cpp"
          sparkle_root="$RUNNER_TEMP/sparkle"
          rm -rf "$godot_cpp_dir" "$sparkle_root"

          git clone --depth 1 https://github.com/godotengine/godot-cpp.git "$godot_cpp_dir"

          mkdir -p "$sparkle_root"
          curl --fail --location \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            --output "$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xf "$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}.tar.xz" -C "$sparkle_root"

          sparkle_framework="$(find "$sparkle_root" -name Sparkle.framework -type d -print -quit)"
          if [ -z "$sparkle_framework" ]; then
            echo "Sparkle.framework was not found in the downloaded release." >&2
            exit 1
          fi

          for architecture in x86_64 arm64; do
            python3 -m SCons -C native/macos_sparkle \
              platform=macos \
              "arch=$architecture" \
              target=template_release \
              "api_version=${GODOT_VERSION%.*}" \
              "godot_cpp_dir=$godot_cpp_dir" \
              "sparkle_framework_dir=$(dirname "$sparkle_framework")"
          done

          bridge_path="addons/macos_sparkle/bin/libmacos_sparkle.macos.universal.dylib"
          lipo -create \
            addons/macos_sparkle/bin/libmacos_sparkle.macos.x86_64.dylib \
            addons/macos_sparkle/bin/libmacos_sparkle.macos.arm64.dylib \
            -output "$bridge_path"
          if [ ! -f "$bridge_path" ]; then
            echo "Sparkle GDExtension was not produced at $bridge_path." >&2
            exit 1
          fi

          echo "SPARKLE_ROOT=$sparkle_root" >> "$GITHUB_ENV"
          echo "SPARKLE_FRAMEWORK_PATH=$sparkle_framework" >> "$GITHUB_ENV"

      - name: Export macOS build
        run: |
          mkdir -p .exports/macos dist
          godot --headless --path . --export-release "macOS" .exports/macos/OtherGods-macos.zip

      - name: Configure macOS Developer ID certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail

          if [ -z "${MACOS_CERTIFICATE_P12_BASE64}" ]; then
            echo "MACOS_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            echo "No Developer ID certificate configured; using ad-hoc signing."
            exit 0
          fi

          if [ -z "${MACOS_CERTIFICATE_PASSWORD}" ]; then
            echo "MACOS_CERTIFICATE_PASSWORD is required when MACOS_CERTIFICATE_P12_BASE64 is set." >&2
            exit 1
          fi

          keychain_password="$(openssl rand -hex 16)"
          keychain_path="$RUNNER_TEMP/othergods-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/othergods-certificate.p12"

          echo "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "$keychain_path" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          if [ -z "${MACOS_CODESIGN_IDENTITY}" ]; then
            MACOS_CODESIGN_IDENTITY="$(security find-identity -v -p codesigning "$keychain_path" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          fi
          if [ -z "${MACOS_CODESIGN_IDENTITY}" ]; then
            echo "Could not find a Developer ID Application signing identity." >&2
            exit 1
          fi

          echo "MACOS_SIGN_IDENTITY=${MACOS_CODESIGN_IDENTITY}" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=${keychain_path}" >> "$GITHUB_ENV"

      - name: Sign and package macOS build
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail

          rm -rf .exports/macos/unpacked dist/OtherGods-macos.zip
          mkdir -p .exports/macos/unpacked dist
          ditto -x -k .exports/macos/OtherGods-macos.zip .exports/macos/unpacked

          app_path="$(find .exports/macos/unpacked -maxdepth 1 -name "*.app" -print -quit)"
          if [ -z "${app_path}" ]; then
            echo "No .app bundle found in macOS export." >&2
            exit 1
          fi

          is_tag_release=false
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            is_tag_release=true
          fi
          if [ "$is_tag_release" = true ]; then
            missing_secrets=()
            for secret_name in \
              MACOS_CERTIFICATE_P12_BASE64 \
              MACOS_CERTIFICATE_PASSWORD \
              APPLE_ID \
              APPLE_APP_PASSWORD \
              APPLE_TEAM_ID \
              SPARKLE_PUBLIC_ED_KEY \
              SPARKLE_PRIVATE_ED_KEY
            do
              if [ -z "${!secret_name:-}" ]; then
                missing_secrets+=("$secret_name")
              fi
            done
            if [ "${#missing_secrets[@]}" -ne 0 ]; then
              echo "Signed macOS auto-update releases require: ${missing_secrets[*]}" >&2
              exit 1
            fi
          fi

          mkdir -p "$app_path/Contents/Frameworks"
          ditto "$SPARKLE_FRAMEWORK_PATH" "$app_path/Contents/Frameworks/Sparkle.framework"

          bundled_bridge="$(find "$app_path" -name libmacos_sparkle.macos.universal.dylib -type f -print -quit)"
          if [ -z "$bundled_bridge" ]; then
            echo "The exported app does not contain the Sparkle GDExtension." >&2
            exit 1
          fi
          lipo -verify_arch x86_64 arm64 "$bundled_bridge"
          otool -L "$bundled_bridge"

          plist_path="$app_path/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c \
            "Add :SUFeedURL string https://github.com/sprushy/OtherGodsinGodot/releases/latest/download/appcast.xml" \
            "$plist_path"
          /usr/libexec/PlistBuddy -c "Add :SUEnableAutomaticChecks bool true" "$plist_path"
          /usr/libexec/PlistBuddy -c "Add :SUScheduledCheckInterval integer 86400" "$plist_path"
          if [ -n "${SPARKLE_PUBLIC_ED_KEY}" ]; then
            /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string ${SPARKLE_PUBLIC_ED_KEY}" "$plist_path"
          fi

          if [ "${MACOS_SIGN_IDENTITY}" = "-" ]; then
            codesign --force --deep --sign - "$app_path"
          else
            codesign --force --deep --options runtime --timestamp --sign "${MACOS_SIGN_IDENTITY}" "$app_path"
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"

          if [ "${MACOS_SIGN_IDENTITY}" != "-" ] && [ -n "${APPLE_ID}" ] && [ -n "${APPLE_APP_PASSWORD}" ] && [ -n "${APPLE_TEAM_ID}" ]; then
            notary_zip=".exports/macos/OtherGods-macos-notary.zip"
            ditto -c -k --keepParent "$app_path" "$notary_zip"
            xcrun notarytool submit "$notary_zip" \
              --apple-id "${APPLE_ID}" \
              --password "${APPLE_APP_PASSWORD}" \
              --team-id "${APPLE_TEAM_ID}" \
              --wait
            xcrun stapler staple "$app_path"
            spctl --assess --type execute --verbose=4 "$app_path"
          elif [ "${MACOS_SIGN_IDENTITY}" != "-" ]; then
            echo "Developer ID signing is configured, but notarization secrets are missing; packaging signed but unnotarized app."
          else
            echo "Packaged ad-hoc signed app. Users may still need Finder Open Anyway unless Developer ID notarization is configured."
          fi

          ditto -c -k --keepParent "$app_path" dist/OtherGods-macos.zip

          if [ "$is_tag_release" = true ]; then
            private_key_path="$RUNNER_TEMP/sparkle_private_key"
            printf '%s' "$SPARKLE_PRIVATE_ED_KEY" > "$private_key_path"
            chmod 600 "$private_key_path"

            signature="$("$SPARKLE_ROOT/bin/sign_update" \
              --ed-key-file "$private_key_path" \
              dist/OtherGods-macos.zip)"
            release_version="${GITHUB_REF_NAME#v}"
            release_url="https://github.com/sprushy/OtherGodsinGodot/releases/download/${GITHUB_REF_NAME}/OtherGods-macos.zip"
            publication_date="$(LC_ALL=C date -R)"

            cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Other Gods Updates</title>
              <link>https://github.com/sprushy/OtherGodsinGodot/releases</link>
              <description>Other Gods macOS releases</description>
              <language>en</language>
              <item>
                <title>${GITHUB_REF_NAME}</title>
                <pubDate>${publication_date}</pubDate>
                <sparkle:minimumSystemVersion>11.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="${release_url}"
                  sparkle:version="${release_version}"
                  sparkle:shortVersionString="${release_version}"
                  ${signature}
                  type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OtherGods-macos
          path: |
            dist/OtherGods-macos.zip
            dist/appcast.xml

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OtherGods-macos.zip
            dist/appcast.xml
