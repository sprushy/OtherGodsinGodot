name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: false

      - name: Run project preflight
        run: |
          mkdir -p .ci
          godot --headless --path . --script res://scripts/ci/preflight_probe.gd -- preflight_result_file=.ci/preflight_result.txt
          grep -q '^PASS' .ci/preflight_result.txt

  export-windows:
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build version
        shell: pwsh
        env:
          BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          ((Get-Content project.godot) -replace '^config/version=.*$', "config/version=`"$env:BUILD_VERSION`"") | Set-Content project.godot

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: true

      - name: Export Windows build
        run: |
          mkdir -p .exports/windows .exports/server dist
          godot --headless --path . --export-release "Windows Desktop" .exports/windows/OtherGods.exe
          godot --headless --path . --export-release "Windows Dedicated Server" .exports/server/OtherGodsServer.exe

      - name: Package release zips
        run: |
          cd .exports/windows
          zip -9 -r ../../dist/OtherGods-windows.zip *
          cd ../server
          zip -9 -r ../../dist/OtherGodsServer-windows.zip *

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OtherGods-windows
          path: |
            dist/OtherGods-windows.zip
            dist/OtherGodsServer-windows.zip

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OtherGods-windows.zip
            dist/OtherGodsServer-windows.zip

  export-macos:
    runs-on: macos-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build version
        shell: pwsh
        env:
          BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          ((Get-Content project.godot) -replace '^config/version=.*$', "config/version=`"$env:BUILD_VERSION`"") | Set-Content project.godot

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: true

      - name: Export macOS build
        run: |
          mkdir -p .exports/macos dist
          godot --headless --path . --export-release "macOS" .exports/macos/OtherGods-macos.zip
          cp .exports/macos/OtherGods-macos.zip dist/OtherGods-macos.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OtherGods-macos
          path: dist/OtherGods-macos.zip

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OtherGods-macos.zip
